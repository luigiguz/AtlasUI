# Deploy Atlas en runner self-hosted (VerkkuRunner / RPi).
# Sin actions de terceros: el runner a veces no puede descargar desde codeload.github.com.

name: Atlas — dev deploy (RPi)

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      no_cache:
        description: "docker compose build --no-cache"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: atlas-dev-deploy-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build + Compose dev (RPi)
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    timeout-minutes: 90

    env:
      COMPOSE_PROJECT_NAME: atlas
      DOCKER_BUILDKIT: "1"
      ATLAS_API_IMAGE: atlas-api
      ATLAS_UI_IMAGE: atlas-ui
      ATLAS_TAG: ${{ github.sha }}
      ATLAS_PUBLIC_API_URL: http://127.0.0.1:8765
      # Revisiones SHA antiguas de atlas-api / atlas-ui a conservar (además de :latest y el deploy actual)
      ATLAS_IMAGE_KEEP_REVISIONS: "3"

    steps:
      - name: Checkout (git nativo)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          ref="${{ github.ref }}"
          sha="${{ github.sha }}"
          if [[ -d .git ]]; then
            git remote set-url origin "$repo"
            git fetch --depth=1 origin "$sha"
            git checkout --force FETCH_HEAD
          else
            git clone --depth=1 "$repo" .
            git fetch --depth=1 origin "$sha"
            git checkout --force FETCH_HEAD
          fi
          echo "En $(pwd) @ $(git rev-parse --short HEAD)"

      - name: Asegurar tunnels.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/tunnels.json ]]; then
            exit 0
          fi
          if [[ -f scripts/tunnels.example.json ]]; then
            cp scripts/tunnels.example.json scripts/tunnels.json
          else
            printf '%s\n' '{"meta":{"created_by":"github-actions"},"sites":{}}' > scripts/tunnels.json
          fi

      - name: Docker y Compose
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Build imagen
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.no_cache }}" == "true" ]]; then
            docker compose -f docker-compose.yml build --no-cache --pull atlas-api atlas-tunnels atlas-ui
          else
            docker compose -f docker-compose.yml build --pull atlas-api atlas-tunnels atlas-ui
          fi
          docker image inspect "${ATLAS_API_IMAGE}:${ATLAS_TAG}" >/dev/null
          docker image inspect "${ATLAS_UI_IMAGE}:${ATLAS_TAG}" >/dev/null
          docker tag "${ATLAS_API_IMAGE}:${ATLAS_TAG}" "${ATLAS_API_IMAGE}:latest"
          docker tag "${ATLAS_UI_IMAGE}:${ATLAS_TAG}" "${ATLAS_UI_IMAGE}:latest"

      - name: Desplegar (Compose)
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml up -d --remove-orphans --no-build

      - name: Estado
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml images

      - name: Comprobar HTTP (local)
        shell: bash
        env:
          ATLAS_API_PORT: "8765"
          ATLAS_UI_PORT: "8088"
        run: |
          set -euo pipefail
          api_url="http://127.0.0.1:${ATLAS_API_PORT}/api/health"
          ui_url="http://127.0.0.1:${ATLAS_UI_PORT}/"
          api_code="000"
          ui_code="000"
          for attempt in $(seq 1 24); do
            if command -v curl >/dev/null 2>&1; then
              api_code="$(curl -fsS -o /dev/null -w "%{http_code}" "$api_url" 2>/dev/null || echo "000")"
            elif command -v wget >/dev/null 2>&1; then
              if wget -qO- "$api_url" >/dev/null 2>&1; then api_code="200"; else api_code="000"; fi
            fi
            echo "Intento ${attempt}/24 — API HTTP ${api_code} ${api_url}"
            if [[ "$api_code" == "200" ]]; then
              break
            fi
            sleep 5
          done
          [[ "$api_code" == "200" ]]
          if command -v curl >/dev/null 2>&1; then
            ui_code="$(curl -fsS -o /dev/null -w "%{http_code}" "$ui_url" || true)"
          elif command -v wget >/dev/null 2>&1; then
            if wget -qO- "$ui_url" >/dev/null 2>&1; then ui_code="200"; else ui_code="000"; fi
          fi
          echo "UI HTTP ${ui_code} ${ui_url}"
          [[ "$ui_code" == "200" ]] || [[ "$ui_code" == "304" ]]

      - name: Mantenimiento imágenes Docker
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          keep_rev="${ATLAS_IMAGE_KEEP_REVISIONS:-3}"
          repos=("${ATLAS_API_IMAGE}" "${ATLAS_UI_IMAGE}")

          echo "Conservar por repo: tag latest, tag ${ATLAS_TAG}, y hasta ${keep_rev} revisiones SHA anteriores."
          echo "Nunca se eliminan imágenes usadas por contenedores en ejecución."

          prune_repo() {
            local repo="$1"
            echo ""
            echo "== ${repo} =="
            if ! docker images -q "${repo}" | grep -q .; then
              echo "Sin imágenes locales."
              return 0
            fi

            mapfile -t lines < <(
              docker images "${repo}" --format '{{.Tag}}\t{{.CreatedAt}}\t{{.ID}}' \
                | grep -v $'^<none>\t' || true
            )
            if ((${#lines[@]} == 0)); then
              return 0
            fi

            candidates=()
            while IFS=$'\t' read -r tag created id; do
              [[ "$tag" == "latest" ]] && continue
              [[ "$tag" == "${ATLAS_TAG}" ]] && continue
              candidates+=("${created}"$'\t'"${tag}"$'\t'"${id}")
            done < <(printf '%s\n' "${lines[@]}")

            if ((${#candidates[@]} == 0)); then
              echo "Sin revisiones antiguas que podar."
              return 0
            fi

            mapfile -t sorted < <(printf '%s\n' "${candidates[@]}" | sort -r)
            kept=0
            for entry in "${sorted[@]}"; do
              IFS=$'\t' read -r _created tag id <<< "$entry"
              short_id="${id#sha256:}"
              if docker ps --filter "ancestor=${id}" -q | grep -q .; then
                echo "En uso, se conserva: ${repo}:${tag}"
                continue
              fi
              if docker ps -q | xargs -r docker inspect --format '{{.Image}}' 2>/dev/null \
                | grep -q "${short_id}"; then
                echo "En uso (inspect), se conserva: ${repo}:${tag}"
                continue
              fi
              if (( kept < keep_rev )); then
                echo "Conservar rollback (${kept}/${keep_rev}): ${repo}:${tag}"
                kept=$((kept + 1))
                continue
              fi
              echo "Eliminar: ${repo}:${tag}"
              docker rmi "${repo}:${tag}" 2>/dev/null || echo "  (omitida: capa compartida o en uso)"
            done
          }

          for repo in "${repos[@]}"; do
            prune_repo "$repo"
          done

          echo ""
          echo "== Capas intermedias (dangling) =="
          docker image prune -f

          echo ""
          echo "== Caché de build antigua (>5 días) =="
          docker builder prune -f --filter "until=120h" 2>/dev/null || docker builder prune -f

          echo ""
          echo "== Contenedores detenidos =="
          docker container prune -f

          echo ""
          echo "== Imágenes huérfanas atlasvpn-* (legacy) =="
          mapfile -t legacy_ids < <(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null \
            | grep -E '^atlasvpn-' || true)
          if ((${#legacy_ids[@]} > 0)); then
            printf '%s\n' "${legacy_ids[@]}"
            docker rmi "${legacy_ids[@]}" 2>/dev/null || true
          else
            echo "Ninguna."
          fi

          echo ""
          echo "== Uso de disco =="
          docker system df || true
          df -h /var/lib/docker 2>/dev/null || df -h .

      - name: Logs del servicio (solo si falló antes)
        if: failure()
        shell: bash
        run: docker compose -f docker-compose.yml logs --no-color --tail=80 atlas-api atlas-tunnels atlas-ui || true