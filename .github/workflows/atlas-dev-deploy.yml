# Deploy Atlas en runner self-hosted (VerkkuRunner / RPi).
# Sin actions de terceros: el runner a veces no puede descargar desde codeload.github.com.

name: Atlas — dev deploy (RPi)

on:
  push:
    branches:
      - dev
      - feat/atlas-platform
  workflow_dispatch:
    inputs:
      no_cache:
        description: "docker compose build --no-cache"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: atlas-dev-deploy-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build + Compose dev (RPi)
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    timeout-minutes: 90

    env:
      COMPOSE_PROJECT_NAME: atlas
      DOCKER_BUILDKIT: "1"
      ATLAS_API_IMAGE: atlas-api
      ATLAS_UI_IMAGE: atlas-ui
      ATLAS_TAG: ${{ github.sha }}
      ATLAS_PUBLIC_API_URL: http://127.0.0.1:8765

    steps:
      - name: Checkout (git nativo)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          ref="${{ github.ref }}"
          sha="${{ github.sha }}"
          if [[ -d .git ]]; then
            git remote set-url origin "$repo"
            git fetch --depth=1 origin "$sha"
            git checkout --force FETCH_HEAD
          else
            git clone --depth=1 "$repo" .
            git fetch --depth=1 origin "$sha"
            git checkout --force FETCH_HEAD
          fi
          echo "En $(pwd) @ $(git rev-parse --short HEAD)"

      - name: Asegurar tunnels.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/tunnels.json ]]; then
            exit 0
          fi
          if [[ -f scripts/tunnels.example.json ]]; then
            cp scripts/tunnels.example.json scripts/tunnels.json
          else
            printf '%s\n' '{"meta":{"created_by":"github-actions"},"sites":{}}' > scripts/tunnels.json
          fi

      - name: Docker y Compose
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Build imagen
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.no_cache }}" == "true" ]]; then
            docker compose -f docker-compose.yml build --no-cache --pull
          else
            docker compose -f docker-compose.yml build --pull
          fi

      - name: Etiquetar también como latest
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${ATLAS_API_IMAGE}:${ATLAS_TAG}" "${ATLAS_API_IMAGE}:latest"
          docker tag "${ATLAS_UI_IMAGE}:${ATLAS_TAG}" "${ATLAS_UI_IMAGE}:latest"

      - name: Desplegar (Compose)
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml up -d --remove-orphans

      - name: Estado
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml images

      - name: Comprobar HTTP (local)
        shell: bash
        env:
          ATLAS_API_PORT: "8765"
          ATLAS_UI_PORT: "8088"
        run: |
          set -euo pipefail
          sleep 3
          api_url="http://127.0.0.1:${ATLAS_API_PORT}/api/health"
          ui_url="http://127.0.0.1:${ATLAS_UI_PORT}/"
          if command -v curl >/dev/null 2>&1; then
            api_code="$(curl -fsS -o /dev/null -w "%{http_code}" "$api_url" || true)"
            echo "API HTTP $api_code $api_url"
            [[ "$api_code" == "200" ]]
            ui_code="$(curl -fsS -o /dev/null -w "%{http_code}" "$ui_url" || true)"
            echo "UI HTTP $ui_code $ui_url"
            [[ "$ui_code" == "200" ]] || [[ "$ui_code" == "304" ]]
          elif command -v wget >/dev/null 2>&1; then
            wget -qO- "$api_url" >/dev/null
            wget -qO- "$ui_url" >/dev/null
          fi

      - name: Logs del servicio (solo si falló antes)
        if: failure()
        shell: bash
        run: docker compose -f docker-compose.yml logs --no-color --tail=80 atlas-api atlas-ui || true