# Desbloquea la cola cuando el runner self-hosted no toma jobs (run atascado en "queued").
# Corre en GitHub-hosted (siempre disponible) y dispara el deploy en el RPi.

name: Atlas — desbloquear CI dev

on:
  push:
    branches:
      - dev
      - feat/atlas-platform
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Pasar --no-cache al build en el RPi"
        required: false
        default: "false"
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  unblock-and-deploy:
    name: Cancelar cola + disparar deploy
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar runs atascados del deploy
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const workflowFile = "atlas-dev-selfhosted.yml";
            const currentRunId = context.runId;

            for (const status of ["queued", "waiting", "pending"]) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowFile,
                branch,
                status,
                per_page: 20,
              });
              for (const run of data.workflow_runs) {
                if (run.id === currentRunId) continue;
                core.info(`Cancelando run #${run.run_number} (${run.status}) ${run.html_url}`);
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                } catch (e) {
                  core.warning(`No se pudo cancelar #${run.run_number}: ${e.message}`);
                }
              }
            }

      - name: Disparar build y deploy (self-hosted)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.ref.replace("refs/heads/", "");
            const noCache =
              context.eventName === "workflow_dispatch" &&
              String(context.payload.inputs?.no_cache) === "true"
                ? "true"
                : "false";
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "atlas-dev-selfhosted.yml",
              ref,
              inputs: { no_cache: noCache },
            });
            core.info(`Deploy disparado en rama ${ref} (no_cache=${noCache})`);
